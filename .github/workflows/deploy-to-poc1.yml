name: Deploy to POC1
on: 
  workflow_dispatch:
    inputs:
      package:
        description: 'The ID (starts with 04t) or alias of the package version to install'
        required: true
        
permissions:
 contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master

    - name: 'Install Salesforce CLI'
      run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sf-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sf version

    - name: Authenticate with Sandbox
      run: |
        echo ${{ secrets.SALESFORCE_POC1_AUTH }} > sfdxurl.txt
        sf auth:sfdxurl:store --sfdx-url-file sfdxurl.txt --alias POC1

    - name: Remove auth file
      run: rm -f ./sfdxurl.txt

    - name: Deploy Source in dev-app-pre
      run: sf project deploy start -d dev-app-pre -o POC1 -w 15

    - name: Install version ID
      run: sf package install --package "${{ github.event.inputs.package }}" -o POC1 -b 15 --noprompt --wait 10

    - name: Re-deploy default objects
      run: sf project deploy start -d force-app/main/default/objects -o POC1 --ignore-conflicts -w 15 

    - name: Re-deploy default queues
      run: sf project deploy start -d force-app/main/default/queues -o POC1 -w 15 

    - name: Deploy source default OmniStudio-Components 
      run: sf project deploy start -d OmniStudio-Components -o POC1 -w 30 

    - name: Re-Deploy OmniScripts in OmniStudio Folder
      run: sf project deploy start -d OmniStudio-Components/main/default/omniScripts -o POC1 -w 30 --ignore-conflicts

    - name: Deploy Source in dev-app-post
      run: sf project deploy start -d dev-app-post -o POC1 -w 15 --ignore-conflicts

    - name: Deploy documentGenerationSettings
      run: sf project deploy start -d documentGenerationSettings -o POC1 -w 15 --ignore-conflicts

    - name: Run Apex Tests
      run: sf apex run test -o POC1 -w 15

#    - name: Deploy destructive changes
#      run: sdfx force:mdapi:deploy --postdestructivechanges destructiveChanges -u POC1 -o -g -l RunLocalTests -w 15
