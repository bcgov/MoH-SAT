name: Build Check
on: [pull_request_target]

jobs:
  automatic-build-check:
    runs-on: ubuntu-latest
    env:
      SF_DISABLE_SOURCE_MEMBER_POLLING: true
    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: 'Install Salesforce CLI'
      run: |
          wget https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz
          mkdir ~/sfdx
          tar xJf sf-linux-x64.tar.xz -C ~/sfdx --strip-components 1
          echo "$HOME/sfdx/bin" >> $GITHUB_PATH
          ~/sfdx/bin/sf version
 
    - name: Authenticate PHCI org
      run: |
        echo "${{ secrets.SALESFORCE_PHCI_AUTH }}" > ./authfile
        sf org login sfdx-url -f authfile -a PHCI

    - name: Remove auth file
      run: rm -f ./sfdxurl.txt

    - name: Deploy source dev-app-pre
      run: sf project deploy start -d dev-app-pre --target-org PHCI -w 15 --ignore-conflicts
 
    - name: Deploy source force-app
      run: sf project deploy start -d force-app --target-org PHCI -w 15 --ignore-conflicts
 
    - name: Deploy source default objects
      run: sf project deploy start -d force-app/main/default/objects --target-org PHCI -w 15 --ignore-conflicts
 
    - name: Deploy source default queues
      run:  sf project deploy start -d force-app/main/default/queues --target-org PHCI -w 15 --ignore-conflicts

    - name: Deploy source default OmniStudio-Components 
      run: sf project deploy start -d OmniStudio-Components --target-org PHCI -w 60 --ignore-conflicts

    - name: Re-Deploy OmniScripts in OmniStudio Folder
      run: sf project deploy start -d OmniStudio-Components/main/default/omniScripts --target-org PHCI -w 60 --ignore-conflicts

    - name: Deploy source default dev-app-post
      run: sf project deploy start -d dev-app-post --target-org PHCI -w 15 --ignore-conflicts

    - name: Deploy documentGenerationSettings
      run: sf project deploy start -d documentGenerationSettings --target-org PHCI -w 15 --ignore-conflicts
        
    - name: Run Apex test
      run: sf apex run test --target-org PHCI -w 15
    

        
    
  
